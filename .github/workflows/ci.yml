name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, pdo_mysql, pdo_sqlite, mbstring, curl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: scripts/lint.sh
      - run: php tests/run.php

  image:
    name: Image builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=pr-${{ github.event.number }}
          cache-from: type=gha
