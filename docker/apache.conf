ServerName wankarr
ServerTokens Prod
ServerSignature Off

# WANKARR_PORT comes from the container environment (default 8484).
Listen ${WANKARR_PORT}

<VirtualHost *:${WANKARR_PORT}>
    DocumentRoot /app/public

    <Directory /app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Dotfiles are never served.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Static assets are versioned (?v=…), so they can be cached hard.
    <Directory /app/public/assets>
        Header set Cache-Control "public, max-age=604800"
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined env=!dontlog
    SetEnvIf Request_URI "^/api/health\.php$" dontlog
</VirtualHost>
