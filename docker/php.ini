expose_php = Off
memory_limit = 512M
max_execution_time = 300
; Imports upload in chunks over PUT, so these only bound ordinary form posts.
post_max_size = 16M
upload_max_filesize = 16M
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
; Code in the image never changes at runtime.
opcache.validate_timestamps = 0
