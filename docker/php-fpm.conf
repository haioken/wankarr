[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[wankarr]
user = wankarr
group = wankarr
listen = /run/php-fpm.sock
listen.owner = wankarr
listen.group = wankarr
listen.mode = 0660

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; wankarr is configured through WANKARR_* environment variables.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
